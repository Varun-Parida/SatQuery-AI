[project]
name = "satquery-ai"
version = "0.1.0"
description = "Local satellite-imagery AI application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pillow>=10,<12",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "data_pipeline*", "evaluation*", "ml*", "orchestration*", "rendering*", "shared*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1.0"]

"torch",
"transformers",